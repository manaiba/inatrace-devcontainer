# Dev Container stack for the multi-repo workspace.
#
#   app       the toolchain image built from .devcontainer/Dockerfile. This is
#             the container VS Code and `devcontainer exec` attach to, and where
#             every repo under /src is worked on.
#
# The mounts, published ports and environment variables below used to live in
# devcontainer.json (`mounts`, `appPort`, `containerEnv`). Those properties are
# not honoured for Compose-based dev containers, so they belong here now.
#
# `.env` — HOST_HOME and HOST_RUNTIME_DIR, interpolated into the bind mounts
# below — is generated by initialize.sh on the host before this file is read.
# It is git-ignored and should not be edited by hand.

name: devcontainer-inatrace

services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      args:
        # Filename of the GitHub token under your host home dir (default
        # ~/.gh_token_manaiba). To use a different file, change it HERE and in
        # the matching gh-token mount under `volumes:` below.
        GH_TOKEN_FILE: .gh_token_manaiba

    # The image inherits python's CMD, which exits immediately. A dev container
    # needs a process that stays up for the tooling to attach to.
    command: sleep infinity
    # Reap the zombies that `sleep infinity` as PID 1 would otherwise collect.
    init: true

    # ---- docker-in-docker ----
    # Starts the nested Docker daemon, then execs `command` above. The script is
    # written by the Dockerfile; see the "Docker engine" block there for why this
    # is a real daemon rather than the host socket mounted in.
    entrypoint: /usr/local/share/docker-init.sh
    # dockerd needs to create its own cgroups, mount filesystems and program
    # iptables — none of which an unprivileged container may do. This grants the
    # dev container full access to the host kernel, which is the price of nesting
    # a daemon; the workspace is already a trusted local sandbox.
    privileged: true

    # SELinux (Fedora/RHEL hosts): without this, every bind mount above is
    # labelled container_file_t-or-nothing and the container is denied access
    # to the host sockets, the token and ~/.gitconfig. The usual `:z`/`:Z`
    # suffixes are not an option here — they RELABEL the host paths, which for
    # the desktop sockets and the home-directory files means breaking them for
    # the host session. Disabling the label for this container is the narrow
    # fix. No-op on hosts without SELinux.
    security_opt:
      - label=disable

    volumes:
      # The ONLY workspace mount: the host's ./src becomes /src in the
      # container. setup.sh, repos.txt, CLAUDE.md and the cloned repos all live
      # there. There is no /workspace mount.
      - ../src:/src:cached
      # GitHub token (read-only) -> /run/secrets/gh_token. setup.sh
      # authenticates gh with it and clones over HTTPS. Keep the filename in
      # sync with the GH_TOKEN_FILE build arg above.
      - ${HOST_HOME}/.gh_token_manaiba:/run/secrets/gh_token:ro
      # Host git identity (read-only), included by the container's writable
      # global config (see Dockerfile). No SSH keys are mounted.
      - ${HOST_HOME}/.gitconfig:/home/dev/.gitconfig.host:ro
      # Persist Claude Code state (sessions, projects, history, settings) and
      # bash history across container rebuilds. Docker seeds a fresh volume
      # from the image, so the build-time settings.json is there the first
      # time; after that the volume's copy wins.
      - inatrace-claude:/home/dev/.claude
      - inatrace-bash-history:/home/dev/.commandhistory
      # Persist the VS Code server directory, so extensions installed by hand
      # inside the container — plus their state and any extension sign-ins —
      # survive a rebuild instead of having to be reinstalled every time. The
      # downloaded server binaries live here too, which also makes the first
      # attach after a rebuild faster. Extensions that should exist for
      # EVERYONE belong in devcontainer.json's
      # `customizations.vscode.extensions` instead: that list is reproducible,
      # this volume is only your local machine's state.
      - inatrace-vscode-server:/home/dev/.vscode-server
      # Storage for the NESTED Docker daemon: its images, its containers and
      # their writable layers. A named volume, not a directory in the container:
      # overlay2 refuses to run on top of the container's own overlayfs, and
      # anything pulled would otherwise be re-downloaded after every rebuild.
      - inatrace-docker:/var/lib/docker

      # ---- Host desktop bridges (Linux) ----
      # Two sockets from the host desktop session, which together give the
      # container a microphone (Claude's /voice), image paste from the
      # clipboard, and a browser window that opens on YOUR screen. See
      # `environment:` below. initialize.sh creates both on the host first, so
      # Docker never replaces a missing socket with a root-owned directory.
      #
      # PulseAudio/PipeWire socket -> microphone. No cookie is mounted: the
      # server authenticates on the socket's unix permissions (same UID).
      - ${HOST_RUNTIME_DIR}/pulse/native:/tmp/host-pulse
      # Wayland socket -> clipboard + headed browser. If your session is not
      # wayland-0 (`echo $WAYLAND_DISPLAY`), change it here AND in
      # initialize.sh.
      - ${HOST_RUNTIME_DIR}/wayland-0:/tmp/host-wayland

    environment:
      # ---- Desktop bridges ----
      # Microphone: SoX's `rec` and `arecord` (via /etc/asound.conf) both go
      # through this socket.
      PULSE_SERVER: unix:/tmp/host-pulse
      # Clipboard + headed browser. libwayland treats an ABSOLUTE
      # WAYLAND_DISPLAY as a literal path, so the socket does not have to live
      # inside the container's XDG_RUNTIME_DIR.
      WAYLAND_DISPLAY: /tmp/host-wayland
      # Wayland clients expect a private runtime dir; the Dockerfile creates
      # this one (0700, owned by `dev`) since a container has no logind session.
      XDG_RUNTIME_DIR: /tmp/xdg-runtime
      # Set to "true" to make the Playwright MCP browser headless again —
      # useful on a host with no Wayland session. Read by setup-desktop.sh.
      PLAYWRIGHT_HEADLESS: "false"

    # Published as host:container. The container side is the port the service
    # binds INSIDE this dev container — for a nested container (see
    # docker-in-docker above) that is whatever its own `-p` publishes, since
    # nested containers land in this container's network namespace.
    #
    # Anything that binds 127.0.0.1 is unreachable from the host even when
    # published here, so start dev servers on 0.0.0.0: `ng serve --host 0.0.0.0`,
    # `npx expo start --host lan`.
    ports:
      # inatrace-backend. NOTE: application.properties sets server.port = 8081,
      # so 8080 comes either from overriding it (`--server.port=8080`, or
      # SERVER_PORT=8080) or from publishing the nested container as
      # `docker run -p 8080:8081 ...`.
      - "9000:8080"   # Backend
      # inatrace-frontend's Angular dev server (`npm start` -> `ng serve`), which
      # defaults to 4200. Start it as `ng serve --host 0.0.0.0`, or this stays
      # unreachable from the host. For the repo's own Dockerfile instead (nginx,
      # listening on 80) this becomes 9080:80.
      - "9080:4200"   # Frontend
      # inatrace-mobile. Metro defaults to 8081, so start it on this port
      # explicitly: `npx expo start --port 9081`. Keeping it off 8081 also
      # avoids clashing with the backend, whose application.properties still
      # says server.port = 8081.
      - "9081:9081"   # Mobile (Expo Metro)

volumes:
  # `name:` pins the exact volume name. Without it Compose prefixes volumes
  # with the project name, so renaming the project would orphan the existing
  # volumes — Claude sessions and shell history — in favour of empty ones.
  inatrace-claude:
    name: inatrace-claude
  inatrace-bash-history:
    name: inatrace-bash-history
  inatrace-vscode-server:
    name: inatrace-vscode-server
  inatrace-docker:
    name: inatrace-docker
